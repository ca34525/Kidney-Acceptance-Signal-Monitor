schema_version: 1
analysis_id: kidney_patient_journey_v2
source_manifest: configs/data_sources.yaml

# published_value and published_precision are the earliest public-availability value and precision
# from the immutable source manifest; month-only releases intentionally do not acquire a day.

# Shared lists keep release-specific timing and shape changes visible without duplicating field names.
field_sets:
  identity: &identity_fields
    [ENTIRE_NAME, PRIMARY_CITY, PRIMARY_STATE, PRIMARY_ZIP, CTR_CD, CTR_TY, ORGAN]
  patient_outcome: &outcome_fields
    [ENTIRE_NAME, CTR_CD, CTR_TY, RELEASE_DATE, ORG, SAL_N_C, SAL_TOTFTX_C18]
  transplant_rate_without_ratio: &rate_fields_without_ratio
    [center, RELEASE_DATE, wl_org, begdate, enddate, TMR_TxPy_c]
  transplant_rate: &rate_fields
    [center, RELEASE_DATE, wl_org, begdate, enddate, TMR_TxPy_c, TX_RR]
  wait_time: &wait_fields
    [ENTIRE_NAME, CTR_CD, CTR_TY, RELEASE_DATE, ORG, TTT_25_C]
  waiting_list_mortality: &waiting_list_mortality_fields
    [center, RELEASE_DATE, wl_org, begdate, enddate, TMR_DthPy_c, TMR_DthN_c, TMR_DthR_c, TMR_DthER_c, WLM_RR, WLM_RR_CREDLO, WLM_RR_CREDHI]
  mortality_after_listing: &mortality_after_listing_fields
    [ENTIRE_NAME, CTR_CD, CTR_TY, begdate, enddate, sfl_all_n_c, sfl_all_py_c, sfl_all_obs_c, sfl_all_exp_c, sfl_all_obs_rate_c, sfl_all_exp_rate_c, sfl_all_hr_c, sfl_all_hr_lb_c, sfl_all_hr_ub_c]
  graft_failure_90_day: &graft_failure_90_day_fields
    [ENTIRE_NAME, CTR_CD, CTR_TY, RELEASE_DATE, GSR_AD_N_C90D, GSR_AD_OBS_C90D, GSR_AD_EXP_C90D, GSR_AD_HR_C90D, GSR_AD_CREDLO_C90D, GSR_AD_CREDHI_C90D]
  graft_failure_1_year_conditional: &graft_failure_1_year_fields
    [ENTIRE_NAME, CTR_CD, CTR_TY, RELEASE_DATE, GSR_AD_N_C1YC, GSR_AD_OBS_C1YC, GSR_AD_EXP_C1YC, GSR_AD_HR_C1YC, GSR_AD_CREDLO_C1YC, GSR_AD_CREDHI_C1YC]

definitions:
  patient_outcome: &outcome_definition
    - SAL_TOTFTX_C18 is the published observed percentage of listed candidates known alive with a functioning transplant at 18 months.
    - SAL_N_C is used only for rounding reconciliation and the boundary-safe empirical-logit transform; the published percentage remains authoritative.
  transplant_rate: &rate_definition
    - TX_RR is the published transplant-rate ratio estimate and TMR_TxPy_c is the program transplant person-time field.
    - The access-table combined center identifier must be reconciled to same-release Tiers code and type fields.
  wait_time: &wait_definition
    - TTT_25_C is the published 25th-percentile time to transplant in months.
    - Not Observed, >72, hyphen, and blank source values remain missing and are never converted to zero.
  waiting_list_mortality: &waiting_list_mortality_definition
    family: waiting_list_mortality
    sheet_name: Tbls B4-B5 & Fig B1-B6 - All
    expected_columns: 78
    required_fields: *waiting_list_mortality_fields
    population: kidney_candidates_after_listing
    event: death_before_transplant_or_removal_for_other_reasons
    denominator: candidate_person_years
    direction: lower_ratio_is_better
    interval_kind: bayesian_credible_interval
    interval_level: 0.95
    definition_notes:
      - WLM_RR is the published waiting-list mortality ratio; the published Bayesian credible interval is authoritative.
      - TMR_DthPy_c is candidate person-time and TMR_DthN_c is the published observed death count.
  mortality_after_listing: &mortality_after_listing_definition
    family: mortality_after_listing
    expected_columns: 107
    required_fields: *mortality_after_listing_fields
    population: kidney_candidates_after_listing
    event: death_after_listing
    denominator: listed_candidate_person_years
    direction: lower_ratio_is_better
    interval_kind: bayesian_credible_interval
    interval_level: 0.95
    definition_notes:
      - sfl_all_hr_c is the published mortality-after-listing hazard ratio for all kidney candidates.
      - Person-years and candidate count are separate denominator context and remain distinct.
  graft_failure_90_day: &graft_failure_90_day_definition
    family: graft_failure_90_day
    sheet_name: TabC5-C12 FigC1-C20 90D 1YC
    expected_columns: 232
    required_fields: *graft_failure_90_day_fields
    population: adult_single_organ_kidney_transplant_recipients
    event: graft_failure_within_90_days
    denominator: adult_kidney_transplants
    direction: lower_ratio_is_better
    interval_kind: bayesian_credible_interval
    interval_level: 0.95
    definition_notes:
      - GSR_AD_HR_C90D is the published adult 90-day graft-failure hazard ratio.
      - Adult all-donor single-organ kidney recipients define this measure.
  graft_failure_1_year_conditional: &graft_failure_1_year_definition
    family: graft_failure_1_year_conditional
    sheet_name: TabC5-C12 FigC1-C20 90D 1YC
    expected_columns: 232
    required_fields: *graft_failure_1_year_fields
    population: adult_single_organ_kidney_recipients_with_functioning_graft_at_day_90
    event: graft_failure_between_day_90_and_one_year
    denominator: adult_recipients_with_functioning_graft_at_day_90
    direction: lower_ratio_is_better
    interval_kind: bayesian_credible_interval
    interval_level: 0.95
    definition_notes:
      - GSR_AD_HR_C1YC is the published adult one-year graft-failure hazard ratio conditional on a functioning graft at day 90.
      - Its denominator is not interchangeable with the 90-day transplant count.

