notes:
  - Expected row counts exclude the workbook's descriptive-label row.
  - Release dates with month precision come from the SRTR archive label and must be displayed as month and year, not as an invented day.
  - The 2505 and 2605 workbooks add eighteen KDPI-greater-than-or-equal-to-60 columns; those fields are optional and display-only.
  - The workbook's published ratio is authoritative because public expected acceptances are rounded.
  - Raw date cells can contain non-midnight components or historic one-day offsets; normalize against the manifest cohort year and retain the raw value in QA output.
