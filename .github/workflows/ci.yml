name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.11.32
      - name: Check dependency lock
        run: uv lock --check
      - name: Sync locked environment
        run: uv sync --frozen
      - name: Check installed dependencies
        run: uv pip check
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy src/kasm
      - name: Test with core branch coverage
        run: >-
          uv run pytest -q
          --cov=src/kasm/data
          --cov=src/kasm/modeling
          --cov=src/kasm/reporting
          --cov=src/kasm/patient_journey
          --cov-branch
          --cov-fail-under=80
      - name: Require V2 coverage independently
        run: uv run coverage report --include="src/kasm/patient_journey/*" --fail-under=80 --precision=2
      - name: Smoke-test tracked offline application process
        shell: bash
        run: |
          uv run streamlit run app/streamlit_app.py --server.headless=true &
          app_pid=$!
          trap 'kill "$app_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              exit 0
            fi
            sleep 1
          done
          exit 1

  container:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build image
        run: docker build -t kidney-acceptance-signal-monitor:ci .
      - name: Verify configured and runtime users are non-root
        shell: bash
        run: |
          test "$(docker image inspect kidney-acceptance-signal-monitor:ci --format '{{.Config.User}}')" = "kasm"
          docker run --detach --name kasm-ci --publish 8501:8501 kidney-acceptance-signal-monitor:ci
          trap 'docker rm --force kasm-ci' EXIT
          test "$(docker exec kasm-ci id -u)" != "0"
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              test "$(docker inspect kasm-ci --format '{{.State.Health.Status}}')" != "unhealthy"
              exit 0
            fi
            sleep 1
          done
          docker logs kasm-ci
          exit 1
